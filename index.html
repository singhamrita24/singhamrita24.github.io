<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#07111c">
	<title>Field Notes — A Personal Portfolio</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
		<a class="brand" href="#home" aria-label="Field Notes home" id="home-link"><span class="brand-mark">∴</span><span class="brand-name">Field Notes</span></a>
		<div class="header-note">An atlas of things<br>I've explored</div>
	</header>
	<main>
		<section class="intro" id="intro">
			<div class="eyebrow">A personal portfolio · 01—03</div>
			<h1>Field Notes</h1>
			<p>A map of the ideas I've explored and built.</p>
		</section>
		<section class="map" id="map" aria-label="Portfolio mind map">
			<svg class="map-lines" viewBox="0 0 930 435" preserveAspectRatio="none" aria-hidden="true">
				<path d="M465 118 C420 170 280 202 158 248"/><path d="M465 118 L465 248"/><path d="M465 118 C510 170 650 202 772 248"/>
				<circle cx="465" cy="118" r="3"/><circle cx="158" cy="248" r="3"/><circle cx="465" cy="248" r="3"/><circle cx="772" cy="248" r="3"/>
			</svg>
			<a class="node main-node engineering" href="#engineering" data-page="engineering"><span class="label">Engineering</span><small>MY DEGREE</small></a>
			<a class="node main-node physics" href="#physics" data-page="physics"><span class="label">Physics</span><small>WHAT MATTERS</small></a>
			<a class="node main-node mathematics" href="#mathematics" data-page="mathematics"><span class="label">Mathematics</span><small>FOR THE LOVE OF IT</small></a>
		</section>
        <p class="hint" id="hint">Select a field to explore it.</p>
		<section class="detail" id="detail" hidden aria-live="polite"></section>
	</main>
	<footer>Amrita Singh</footer>
	<script>
		const fields = {
			engineering: {
				title: "Engineering", index: "01 / MY DEGREE",
				intro: "Some projects I've worked on in my time at university.",
				topics: [
					["Formula Motorsports", "Powertrain and aerodynamics." , "formula-motorsports.html"],
					["Class Projects", "Selected coursework.", "class-projects.html"]
				]
			},
			physics: {
				title: "Physics", index: "02 / STUDYING MATTER",
				intro: "Research I've had the opportunity to get involved with.",
				topics: [
					["Superconductors and Semiconductors", "Electronic materials." , "superconductors-semiconductors.html"],
				]
			},
			mathematics: {
				title: "Mathematics", index: "03 / FOR THE LOVE OF IT",
				intro: "I don't consider myself a math person.",
				topics: [
					["Rational Points on Elliptic Curves", "Solutions to squiggles", "rational-points-elliptic-curves.html"]
				]
			}
		};
		const map = document.getElementById("map");
		const intro = document.getElementById("intro");
		const hint = document.getElementById("hint");
		const detail = document.getElementById("detail");
		function showPage(key) {
			const field = fields[key];
			if (!field) {
				intro.hidden = false; map.hidden = false; hint.hidden = false; detail.hidden = true;
				detail.innerHTML = "";
				return;
			}
			intro.hidden = true; map.hidden = true; hint.hidden = true; detail.hidden = false;
			detail.innerHTML = `<button class="back" type="button" aria-label="Back to all fields">←&nbsp; All fields</button>
				<div class="detail-heading"><div class="eyebrow">${field.index}</div><h2>${field.title}</h2><p>${field.intro}</p></div>
				<div class="topic-map" aria-label="${field.title} topics">${field.topics.map(([title, copy, href]) => href ? `<a class="topic topic-link" href="${href}"><h3>${title}</h3><p>${copy}</p></a>` : `<article class="topic"><h3>${title}</h3><p>${copy}</p></article>`).join("")}</div>`;
			detail.querySelector(".back").addEventListener("click", () => { location.hash = "home"; });
		}
		document.querySelectorAll("[data-page]").forEach(link => link.addEventListener("click", () => showPage(link.dataset.page)));
		document.getElementById("home-link").addEventListener("click", () => showPage("home"));
		window.addEventListener("hashchange", () => showPage(location.hash.slice(1)));
		showPage(location.hash.slice(1));
	</script>
</body>
</html>
