<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#07111c">
	<title>Field Notes — A Personal Portfolio</title>
	<link rel="stylesheet" href="style.css">
	<style>
		/* Keep the map legible and connected at desktop and mobile sizes. */
		.map {
			position: relative;
			display: block;
			width: min(100%, 930px);
			height: clamp(360px, 48vw, 435px);
			margin-inline: auto;
		}
		.map-lines {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			z-index: 0;
			overflow: visible;
		}
		.map-lines path {
			fill: none;
			stroke: rgba(130, 179, 194, .48);
			stroke-width: 2;
			vector-effect: non-scaling-stroke;
		}
		.map-lines circle {
			fill: #9ac7c8;
		}
		.map-lines.mobile-lines { display: none; }
		.map .node {
			position: absolute;
			z-index: 1;
			left: 50%;
			transform: translate(-50%, -50%);
			box-sizing: border-box;
			min-width: 150px;
			padding: 17px 20px;
			border: 1px solid rgba(154, 199, 200, .42);
			border-radius: 12px;
			background: #102331;
			color: #f2f5ee;
			text-align: center;
			text-decoration: none;
			box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
			transition: transform .18s ease, border-color .18s ease, background .18s ease;
		}
		.map .node:hover,
		.map .node:focus-visible {
			transform: translate(-50%, -50%) translateY(-3px);
			border-color: #9ac7c8;
			background: #183242;
		}
		.map .node:focus-visible { outline: 2px solid #9ac7c8; outline-offset: 4px; }
		.map .node .label { display: block; font-size: 1rem; }
		.map .node small { display: block; margin-top: 6px; color: #a9c5c6; font-size: .65rem; letter-spacing: .12em; }
		/* Keep detail pages in the same visual language as the portfolio map. */
		.detail .topic-map {
			position: relative;
			display: grid;
			gap: 22px;
			width: min(100%, 700px);
			margin: 40px auto 0;
			padding: 8px 0;
		}
		.detail .topic-map::before {
			position: absolute;
			top: -32px;
			bottom: 50%;
			left: 50%;
			width: 2px;
			background: rgba(252, 196, 5, .48);
			content: "";
		}
		.detail .topic {
			position: relative;
			z-index: 1;
			display: block;
			box-sizing: border-box;
			width: min(100%, 520px);
			margin-inline: auto;
			padding: 20px 24px;
			border: 1px solid rgba(252, 196, 5, .42);
			border-radius: 12px;
			background: #781200;
			color: #FFF4D6;
			text-align: center;
			text-decoration: none;
			box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
			transition: transform .18s ease, border-color .18s ease, background .18s ease;
		}
		.detail .topic::before {
			position: absolute;
			top: 50%;
			left: 50%;
			width: 10px;
			height: 10px;
			border: 2px solid #9ac7c8;
			border-radius: 50%;
			background: #781200;
			content: "";
			transform: translate(-50%, -50%);
		}
		.detail .topic h3 { margin: 0; color: inherit; }
		.detail .topic p { margin: 8px 0 0; color: #F2C56B; }
		.detail a.topic:hover,
		.detail a.topic:focus-visible {
			transform: translateY(-3px);
			border-color: #FCC405;
			background: #35102F;
		}
		.detail a.topic:focus-visible { outline: 2px solid #FCC405; outline-offset: 4px; }
		.map .root-node {
			top: 25.3%;
			min-width: 170px;
			border-color: #FCC405;
			background: #781200;
		}
		.map .engineering { left: 17%; top: 67.8%; }
		.map .physics { left: 50%; top: 67.8%; }
		.map .mathematics { left: 83%; top: 67.8%; }
		@media (max-width: 600px) {
			.map { height: 620px; }
			.map-lines.desktop-lines { display: none; }
			.map-lines.mobile-lines { display: block; }
			.map .node { left: 50%; min-width: min(230px, 78vw); }
			.map .root-node { top: 11%; }
			.map .engineering { left: 50%; top: 37.5%; }
			.map .physics { left: 50%; top: 62.5%; }
			.map .mathematics { left: 50%; top: 87.5%; }
		}
		@media (prefers-reduced-motion: reduce) {
			.map .node, .detail .topic { transition: none; }
		}
		/* Progressive mind-map layout: root, branches, then linked topics. */
		.map {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 30px;
			width: min(100%, 1100px);
			height: auto;
			min-height: 170px;
			padding: 20px 0 36px;
		}
		.map-lines { display: none !important; }
		.map .node {
			position: relative;
			inset: auto;
			left: auto;
			transform: none;
			font: inherit;
			cursor: pointer;
		}
		.map .node:hover,
		.map .node:focus-visible { transform: translateY(-3px); }
		.map .root-node { top: auto; }
		.map-branches {
			position: relative;
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			align-items: start;
			gap: 24px;
			width: 100%;
			padding-top: 30px;
		}
		.map-branches::before {
			position: absolute;
			top: 0;
			left: 16.66%;
			right: 16.66%;
			height: 1px;
			background: rgba(130, 179, 194, .55);
			content: "";
		}
		.map-branch { position: relative; display: grid; justify-items: center; gap: 18px; }
		.map-branch::before {
			position: absolute;
			top: -30px;
			left: 50%;
			width: 1px;
			height: 30px;
			background: rgba(130, 179, 194, .55);
			content: "";
		}
		.map-branch .node { width: min(100%, 260px); }
		.map-topics { position: relative; display: grid; gap: 12px; width: min(100%, 300px); padding-top: 8px; }
		.map-topics::before {
			position: absolute;
			top: -10px;
			left: 50%;
			height: 18px;
			border-left: 1px solid rgba(130, 179, 194, .55);
			content: "";
		}
		.map-topics .topic {
			position: relative;
			z-index: 1;
			padding: 14px 16px;
			border: 1px solid rgba(154, 199, 200, .3);
			border-radius: 10px;
			background: #102331;
			color: #f2f5ee;
			text-align: center;
			text-decoration: none;
			box-shadow: 0 6px 18px rgba(0, 0, 0, .16);
		}
		.map-topics .topic:hover,
		.map-topics .topic:focus-visible { border-color: #9ac7c8; background: #183242; }
		.map-topics h3 { margin: 0; color: inherit; font-size: .95rem; }
		.map-topics p { margin: 6px 0 0; color: #a9c5c6; font-size: .85rem; }
		@media (max-width: 700px) {
			.map-branches { grid-template-columns: 1fr; gap: 34px; width: min(100%, 420px); }
			.map-branches::before { left: 50%; right: auto; bottom: 0; height: auto; }
			.map-branch { gap: 16px; }
			.map-branch::before { top: -34px; height: 34px; }
		}
	</style>
</head>
<body>
	<header>
		<a class="brand" href="#home" aria-label="Field Notes home" id="home-link"><span class="brand-mark">∴</span><span class="brand-name">Field Notes</span></a>
		<div class="header-note">An atlas of things<br>I've explored</div>
	</header>
	<main>
		<section class="intro" id="intro">
			<div class="eyebrow">A personal portfolio · 01—03</div>
			<h1>Field Notes</h1>
			<p>A map of the ideas I've explored and built.</p>
		</section>
		<section class="map" id="map" aria-label="Portfolio mind map">
			<button class="node root-node" id="root-toggle" type="button" aria-expanded="false"><span class="label">Field Notes</span><small>IDEAS &amp; PROJECTS</small></button>
			<div class="map-branches" id="map-branches" hidden></div>
		</section>
		<p class="hint" id="hint">Select Field Notes to reveal its fields.</p>
		<section class="detail" id="detail" hidden aria-live="polite"></section>
	</main>
	<footer>Amrita Singh</footer>
	<script>
		const fields = {
			engineering: {
				title: "Engineering", index: "01 / MY DEGREE",
				intro: "Some projects I've worked on in my time at university.",
				topics: [
					["Formula Motorsports", "Powertrain and aerodynamics." , "formula-motorsports.html"],
					["Class Projects", "Selected coursework.", "class-projects.html"]
				]
			},
			physics: {
				title: "Physics", index: "02 / STUDYING MATTER",
				intro: "Research I've had the opportunity to get involved with.",
				topics: [
					["Superconductors and Semiconductors", "Electronic materials." , "superconductors-semiconductors.html"],
				]
			},
			mathematics: {
				title: "Mathematics", index: "03 / FOR THE LOVE OF IT",
				intro: "I don't consider myself a math person.",
				topics: [
					["Rational Points on Elliptic Curves", "Solutions to squiggles", "rational-points-elliptic-curves.html"]
				]
			}
		};
		const rootToggle = document.getElementById("root-toggle");
		const branches = document.getElementById("map-branches");
		const hint = document.getElementById("hint");
		let rootExpanded = false;
		const expandedFields = new Set();
		function renderMap() {
			rootToggle.setAttribute("aria-expanded", String(rootExpanded));
			branches.hidden = !rootExpanded;
			branches.innerHTML = rootExpanded ? Object.entries(fields).map(([key, field]) => `
				<div class="map-branch">
					<button class="node main-node ${key}" type="button" data-field="${key}" aria-expanded="${expandedFields.has(key)}">
						<span class="label">${field.title}</span><small>${field.index.split(" / ")[1]}</small>
					</button>
					${expandedFields.has(key) ? `<div class="map-topics" aria-label="${field.title} topics">${field.topics.map(([title, copy, href]) => `<a class="topic" href="${href}"><h3>${title}</h3><p>${copy}</p></a>`).join("")}</div>` : ""}
				</div>`).join("") : "";
			hint.textContent = rootExpanded ? "Select a field to reveal its projects and topics." : "Select Field Notes to reveal its fields.";
		}
		rootToggle.addEventListener("click", () => { rootExpanded = !rootExpanded; renderMap(); });
		branches.addEventListener("click", event => {
			const button = event.target.closest("[data-field]");
			if (!button) return;
			const key = button.dataset.field;
			expandedFields.has(key) ? expandedFields.delete(key) : expandedFields.add(key);
			renderMap();
		});
		document.getElementById("home-link").addEventListener("click", () => {
			rootExpanded = false;
			expandedFields.clear();
			renderMap();
		});
		renderMap();
	</script>
</body>
</html>
