<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#07111c">
	<title>Field Notes — A Personal Portfolio</title>
	<style>
		:root {
			color-scheme: dark;
			--ink: #edf4f5;
			--muted: #91a5b1;
			--line: rgba(165, 202, 211, .2);
			--cyan: #79e1dc;
			--gold: #f0c47c;
			--violet: #c4a5ff;
			--bg: #07111c;
		}
		* { box-sizing: border-box; }
		html { min-height: 100%; background: var(--bg); }
		body {
			margin: 0; min-height: 100vh; color: var(--ink);
			font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
			background: radial-gradient(ellipse at 50% 42%, #142735 0, #0b1925 38%, #07111c 76%);
			overflow-x: hidden;
		}
		body::before {
			content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .24;
			background-image: radial-gradient(#d5f2ee 0.65px, transparent .65px);
			background-size: 41px 41px; mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent);
		}
		header {
			position: relative; z-index: 2; display: flex; justify-content: space-between;
			align-items: center; padding: 27px clamp(22px, 6vw, 88px); border-bottom: 1px solid rgba(180, 218, 222, .1);
		}
		.brand { display: flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; }
		.brand-mark { width: 29px; height: 29px; border: 1px solid var(--cyan); border-radius: 50%; display: grid; place-items: center; color: var(--cyan); font: 14px Georgia, serif; }
		.brand-name { font: 600 11px/1.2 "Segoe UI", sans-serif; letter-spacing: .2em; text-transform: uppercase; }
		.header-note { color: var(--muted); font: 10px/1.4 "Segoe UI", sans-serif; letter-spacing: .18em; text-transform: uppercase; }
		main { position: relative; z-index: 1; max-width: 1180px; margin: auto; padding: 68px 24px 48px; }
		.intro { text-align: center; margin-bottom: 12px; }
		.eyebrow { color: var(--cyan); font: 10px/1.5 "Segoe UI", sans-serif; letter-spacing: .24em; text-transform: uppercase; }
		h1 { margin: 13px 0 12px; font: 400 clamp(36px, 5vw, 61px)/1.08 Georgia, "Times New Roman", serif; letter-spacing: -.035em; }
		.intro p { color: #a9bac2; font: 14px/1.7 Georgia, serif; margin: 0; }
		.map { position: relative; height: 435px; max-width: 930px; margin: 12px auto 0; }
		.map-lines { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
		.map-lines path { fill: none; stroke: rgba(144, 192, 198, .34); stroke-width: 1.15; stroke-dasharray: 4 6; }
		.map-lines circle { fill: var(--bg); stroke: rgba(144, 192, 198, .56); stroke-width: 1; }
		.node {
			position: absolute; display: flex; flex-direction: column; justify-content: center; align-items: center;
			border-radius: 50%; color: var(--ink); text-decoration: none; text-align: center; cursor: pointer;
			transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease; outline: none;
		}
		.node:hover, .node:focus-visible { transform: translate(-50%, -50%) scale(1.055); box-shadow: 0 0 36px color-mix(in srgb, var(--tone) 24%, transparent); border-color: var(--tone); }
		.node .label { font: 400 21px/1.15 Georgia, serif; }
		.node small { margin-top: 8px; color: var(--muted); font: 9px/1.4 "Segoe UI", sans-serif; letter-spacing: .13em; text-transform: uppercase; }
		.main-node { width: 158px; height: 158px; border: 1px solid color-mix(in srgb, var(--tone) 68%, transparent); background: radial-gradient(circle at 38% 30%, color-mix(in srgb, var(--tone) 14%, #142432), rgba(7, 17, 28, .96) 71%); box-shadow: 0 0 0 9px color-mix(in srgb, var(--tone) 5%, transparent), inset 0 0 30px color-mix(in srgb, var(--tone) 8%, transparent); }
		.main-node .label { font-size: 22px; }
		.engineering { --tone: var(--cyan); left: 17%; top: 57%; transform: translate(-50%, -50%); }
		.physics { --tone: var(--gold); left: 50%; top: 27%; transform: translate(-50%, -50%); }
		.mathematics { --tone: var(--violet); left: 83%; top: 57%; transform: translate(-50%, -50%); }
		.engineering:hover, .engineering:focus-visible, .physics:hover, .physics:focus-visible, .mathematics:hover, .mathematics:focus-visible { transform: translate(-50%, -50%) scale(1.055); }
		.hint { margin-top: -1px; color: #738995; text-align: center; font: 10px "Segoe UI", sans-serif; letter-spacing: .13em; text-transform: uppercase; }
		.detail { max-width: 790px; margin: 8px auto 0; animation: appear .35s ease both; }
		.back { display: inline-flex; gap: 9px; align-items: center; border: 0; padding: 10px 0; color: var(--cyan); background: none; cursor: pointer; font: 10px "Segoe UI", sans-serif; letter-spacing: .16em; text-transform: uppercase; }
		.back:hover { color: #fff; }
		.detail-heading { padding: 21px 0 26px; border-bottom: 1px solid var(--line); }
		.detail-heading h2 { margin: 9px 0; font: 400 clamp(32px, 5vw, 48px)/1 Georgia, serif; }
		.detail-heading p { max-width: 550px; margin: 12px 0 0; color: #a9bac2; font: 15px/1.7 Georgia, serif; }
		.topic-map { position: relative; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 22px; padding: 42px 2px 32px; }
		.topic {
			--tone: var(--cyan); position: relative; min-height: 152px; padding: 23px 24px;
			border: 1px solid color-mix(in srgb, var(--tone) 36%, transparent); border-radius: 50%;
			display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
			background: radial-gradient(circle, color-mix(in srgb, var(--tone) 9%, #10202b), rgba(7, 17, 28, .76) 72%);
			box-shadow: 0 0 0 7px color-mix(in srgb, var(--tone) 4%, transparent); aspect-ratio: 1 / .8;
		}
		.topic::before { content: ""; position: absolute; width: 9px; height: 9px; top: -5px; left: 50%; border-radius: 50%; background: var(--tone); box-shadow: 0 0 12px var(--tone); }
		.topic h3 { margin: 0; font: 400 21px Georgia, serif; }
		.topic p { max-width: 220px; margin: 10px 0 0; color: #9cabb2; font: 12px/1.55 Georgia, serif; }
		a.topic-link { color: inherit; text-decoration: none; cursor: pointer; transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
		a.topic-link:hover, a.topic-link:focus-visible { transform: translateY(-4px); border-color: var(--tone); box-shadow: 0 0 24px color-mix(in srgb, var(--tone) 18%, transparent); outline: none; }
		.topic:nth-child(2) { --tone: var(--gold); }
		.topic:nth-child(3) { --tone: var(--violet); }
		footer { position: relative; z-index: 1; padding: 22px 24px 30px; color: #718692; text-align: center; font: 10px "Segoe UI", sans-serif; letter-spacing: .12em; }
		footer span { color: var(--cyan); }
		@keyframes appear { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
		@media (max-width: 620px) {
			header { padding: 20px; } .header-note { max-width: 110px; text-align: right; }
			main { padding: 48px 18px 34px; } .map { height: 485px; margin-top: 17px; }
			.main-node { width: 126px; height: 126px; } .main-node .label { font-size: 18px; }
			.node small { font-size: 8px; } .engineering { left: 24%; top: 70%; } .physics { left: 50%; top: 27%; } .mathematics { left: 76%; top: 70%; }
			.topic-map { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px; padding-top: 30px; }
			.topic { aspect-ratio: 1 / 1; min-height: 0; padding: 17px 12px; } .topic h3 { font-size: 18px; } .topic p { font-size: 11px; }
		}
		@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
	</style>
</head>
<body>
	<header>
		<a class="brand" href="#home" aria-label="Field Notes home" id="home-link"><span class="brand-mark">∴</span><span class="brand-name">Field Notes</span></a>
		<div class="header-note">An atlas of things<br>I've explored</div>
	</header>
	<main>
		<section class="intro" id="intro">
			<div class="eyebrow">A personal portfolio · 01—03</div>
			<h1>Field Notes</h1>
			<p>A map of the ideas I've explored and built.</p>
		</section>
		<section class="map" id="map" aria-label="Portfolio mind map">
			<svg class="map-lines" viewBox="0 0 930 435" preserveAspectRatio="none" aria-hidden="true">
				<path d="M465 118 C420 170 280 202 158 248"/><path d="M465 118 L465 248"/><path d="M465 118 C510 170 650 202 772 248"/>
				<circle cx="465" cy="118" r="3"/><circle cx="158" cy="248" r="3"/><circle cx="465" cy="248" r="3"/><circle cx="772" cy="248" r="3"/>
			</svg>
			<a class="node main-node engineering" href="#engineering" data-page="engineering"><span class="label">Engineering</span><small>systems &amp; making</small></a>
			<a class="node main-node physics" href="#physics" data-page="physics"><span class="label">Physics</span><small>matter &amp; motion</small></a>
			<a class="node main-node mathematics" href="#mathematics" data-page="mathematics"><span class="label">Mathematics</span><small>patterns &amp; proof</small></a>
		</section>
		<section class="detail" id="detail" hidden aria-live="polite"></section>
	</main>
	<footer>Amrita Singh</footer>
	<script>
		const fields = {
			engineering: {
				title: "Engineering", index: "01 / MY DEGREE",
				intro: "Some projects I've worked on in my time at university.",
				topics: [
					["Formula Motorsports", "Powertrain and aerodynamics." , "formula-motorsports.html"],
					["Class Projects", "Selected coursework.", "class-projects.html"]
				]
			},
			physics: {
				title: "Physics", index: "02 / THE CENTER OF WHAT I LOVE",
				intro: "Research I've had the opportunity to get involved with.",
				topics: [
					["Superconductors and Semiconductors", "Electronic materials." , "superconductors-semiconductors.html"],
				]
			},
			mathematics: {
				title: "Mathematics", index: "03 / FOR THE LOVE OF IT",
				intro: "I don't consider myself a math person.",
				topics: [
					["Rational Points on Elliptic Curves", "Solutions to squiggles", "rational-points-elliptic-curves.html"]
				]
			}
		};
		const map = document.getElementById("map");
		const intro = document.getElementById("intro");
		const hint = document.getElementById("hint");
		const detail = document.getElementById("detail");
		function showPage(key) {
			const field = fields[key];
			if (!field) {
				intro.hidden = false; map.hidden = false; hint.hidden = false; detail.hidden = true;
				detail.innerHTML = "";
				return;
			}
			intro.hidden = true; map.hidden = true; hint.hidden = true; detail.hidden = false;
			detail.innerHTML = `<button class="back" type="button" aria-label="Back to all fields">←&nbsp; All fields</button>
				<div class="detail-heading"><div class="eyebrow">${field.index}</div><h2>${field.title}</h2><p>${field.intro}</p></div>
				<div class="topic-map" aria-label="${field.title} topics">${field.topics.map(([title, copy, href]) => href ? `<a class="topic topic-link" href="${href}"><h3>${title}</h3><p>${copy}</p></a>` : `<article class="topic"><h3>${title}</h3><p>${copy}</p></article>`).join("")}</div>`;
			detail.querySelector(".back").addEventListener("click", () => { location.hash = "home"; });
		}
		document.querySelectorAll("[data-page]").forEach(link => link.addEventListener("click", () => showPage(link.dataset.page)));
		document.getElementById("home-link").addEventListener("click", () => showPage("home"));
		window.addEventListener("hashchange", () => showPage(location.hash.slice(1)));
		showPage(location.hash.slice(1));
	</script>
</body>
</html>
